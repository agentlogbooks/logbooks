<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<title>Ideation — Live Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Geist:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     IDEATION — "Observatory" cinematic system
     Deep ink stage · ideas ignite in their temperature-zone light
     ============================================================ */
  :root {
    /* cinematic deep-ink base, faint cool undertone so zone color glows */
    --bg-0: #07080b;        /* page void */
    --bg-1: #0c0e13;        /* panels */
    --bg-2: #11141b;        /* raised */
    --bg-3: #181c25;        /* hover / sunken */
    --line-1: #1c212c;
    --line-2: #2a313f;
    --line-3: #3b4456;
    --ink-1: #eef1f7;       /* primary text */
    --ink-2: #b6bccb;
    --ink-3: #79839a;
    --ink-4: #4a5365;
    --ink-5: #2f3744;

    /* system accent — refined gold (the "instrument" color) */
    --gold:   oklch(0.83 0.13 88);
    --gold-2: oklch(0.70 0.13 80);
    --olive:  oklch(0.80 0.16 140);   /* succeeded / active green */
    --olive-soft: oklch(0.55 0.12 140);
    --amber:  oklch(0.83 0.14 88);
    --amber-deep: oklch(0.70 0.14 78);

    /* tag colors */
    --safe: oklch(0.78 0.10 155);
    --bold: oklch(0.84 0.15 85);
    --wild: oklch(0.74 0.20 22);

    /* temperature zones — luminous, high-chroma so they read as LIGHT */
    --fire:    oklch(0.74 0.20 38);    /* ember */
    --plasma:  oklch(0.72 0.22 308);   /* violet */
    --ice:     oklch(0.80 0.15 218);   /* cyan */
    --ghost:   oklch(0.84 0.08 288);   /* pale lavender */
    --mirror:  oklch(0.86 0.025 250);  /* silver */

    /* status colors */
    --st-active: var(--olive);
    --st-shortlisted: var(--gold);
    --st-selected: oklch(0.82 0.17 150);
    --st-rejected: oklch(0.55 0.08 25);
    --st-parked: var(--ink-4);

    /* type */
    --display: "Bricolage Grotesque", system-ui, sans-serif;
    --serif: "Newsreader", "Times New Roman", serif;
    --sans: "Geist", system-ui, sans-serif;
    --mono: "Space Mono", ui-monospace, monospace;

    --r-sm: 5px;
    --r: 9px;
    --r-lg: 13px;
    --r-xl: 20px;

    /* atmospheric wash */
    --wash-a: oklch(0.55 0.18 308 / 0.16);   /* plasma haze top-right */
    --wash-b: oklch(0.55 0.16 38 / 0.13);    /* ember haze bottom-left */
    --wash-c: oklch(0.55 0.13 218 / 0.10);   /* ice haze center */
    --wash-blend: screen;
    --stage: radial-gradient(120% 90% at 100% 0%, var(--wash-a), transparent 55%),
             radial-gradient(110% 80% at 0% 100%, var(--wash-b), transparent 52%),
             radial-gradient(90% 70% at 50% 60%, var(--wash-c), transparent 60%);
  }

  /* ---------- light theme — clean white + vivid yellow ---------- */
  html[data-theme="light"] {
    --bg-0: #ffffff;        /* pure white page */
    --bg-1: #fbfbfc;        /* faint panel */
    --bg-2: #ffffff;        /* cards */
    --bg-3: #f3f4f6;        /* hover / sunken */
    --line-1: #ececef;
    --line-2: #dcdce2;
    --line-3: #c2c3cc;
    --ink-1: #14151a;       /* near-black, neutral */
    --ink-2: #3e4048;
    --ink-3: #696b76;
    --ink-4: #9a9ca6;
    --ink-5: #c6c8d1;

    /* the yellow accent */
    --gold:   oklch(0.78 0.16 88);     /* vivid, legible yellow */
    --gold-2: oklch(0.70 0.16 82);     /* deeper for gradients */
    --amber:  oklch(0.78 0.16 88);
    --amber-deep: oklch(0.68 0.16 80);
    --olive:  oklch(0.64 0.16 150);    /* clean fresh green — "done/active" */
    --olive-soft: oklch(0.74 0.14 150);

    --safe: oklch(0.56 0.12 158);
    --bold: oklch(0.64 0.16 75);
    --wild: oklch(0.58 0.20 26);

    --fire:    oklch(0.60 0.21 36);
    --plasma:  oklch(0.55 0.22 305);
    --ice:     oklch(0.56 0.16 232);
    --ghost:   oklch(0.60 0.13 288);
    --mirror:  oklch(0.55 0.03 250);

    --st-active: var(--olive);
    --st-shortlisted: var(--gold);
    --st-selected: oklch(0.60 0.17 150);
    --st-rejected: oklch(0.62 0.10 28);
    --st-parked: var(--ink-4);

    /* soft yellow wash on white */
    --wash-a: oklch(0.92 0.10 92 / 0.45);
    --wash-b: oklch(0.92 0.08 78 / 0.35);
    --wash-c: oklch(0.94 0.05 100 / 0.30);
    --wash-blend: normal;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg-0); color: var(--ink-1); font-family: var(--sans); }
  body {
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.45;
    letter-spacing: -0.005em;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #root { width: 100vw; height: 100vh; }

  /* atmospheric stage wash — the observatory haze (cheap, no blend-mode) */
  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: var(--stage);
    opacity: 0.7;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--line-3); }

  /* ---------- keyframes ---------- */
  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
    50%      { box-shadow: 0 0 0 6px transparent; opacity: 0.5; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); filter: blur(3px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes draw {
    from { stroke-dashoffset: var(--len, 200); opacity: 0; }
    to   { stroke-dashoffset: 0; opacity: 1; }
  }
  /* the signature: an idea IGNITES in its zone color, blooms, then settles */
  @keyframes ignite {
    0%   { transform: scale(0.7); opacity: 0;
           box-shadow: 0 0 0 0 var(--glow), 0 0 0px var(--glow); }
    45%  { transform: scale(1.05); opacity: 1;
           box-shadow: 0 0 0 2px var(--glow), 0 0 28px 2px var(--glow); }
    100% { transform: scale(1); opacity: 1;
           box-shadow: 0 0 0 0 transparent, 0 0 0px transparent; }
  }
  @keyframes halo {
    0%   { opacity: 0; transform: scale(0.4); }
    40%  { opacity: 0.9; }
    100% { opacity: 0; transform: scale(2.4); }
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }
  @keyframes sheen {
    0%   { background-position: -180% 0; }
    100% { background-position: 180% 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root">
  <div id="__boot" style="position:fixed;inset:0;display:grid;place-items:center;background:var(--bg-0);">
    <div style="text-align:center;">
      <div style="width:36px;height:36px;margin:0 auto 16px;border-radius:50%;border:1px solid color-mix(in oklch, var(--gold) 40%, var(--line-2));display:grid;place-items:center;box-shadow:0 0 22px -6px color-mix(in oklch, var(--gold) 60%, transparent);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.6" stroke-linecap="round" style="animation:spin 3s linear infinite;">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 3 L12 7 M12 17 L12 21 M3 12 L7 12 M17 12 L21 12 M6 6 L9 9 M15 15 L18 18 M18 6 L15 9 M9 15 L6 18" opacity="0.7"></path>
        </svg>
      </div>
      <div style="font-family:var(--mono,monospace);font-size:11px;letter-spacing:3px;color:var(--ink-3);text-transform:uppercase;">Ideation Engine</div>
      <div style="font-family:var(--serif,serif);font-style:italic;font-size:18px;color:var(--ink-3);margin-top:8px;animation:breathe 1.6s ease-in-out infinite;">warming up the logbook…</div>
    </div>
  </div>
</div>

<script type="text/babel" src="live-data.jsx"></script>
<script type="text/babel" src="views.jsx"></script>
<script type="text/babel" src="app.jsx"></script>

</body>
</html>
